services:
  # ── Backend API (Node.js - Free) ───────────────────────────
  - type: web
    name: tech-store-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DB_PATH
        value: /var/data/ecommerce.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        value: https://tech-store-frontend.onrender.com,https://tech-store-admin.onrender.com
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: tech-store-data
      mountPath: /var/data
      sizeGB: 1
